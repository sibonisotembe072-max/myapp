<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    header {
        background-color: green;
        display: flex;
        gap: 20px;
        color: white;
        padding: 10px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        flex-wrap: wrap;

    }

    .learn {
        width: 200px;
        height: fit-content;
        padding: 8px;
        max-width: 400px;
        min-width: 100px;
        border: double white 5px;
        border-radius: 10px;

    }

    #hesh {
        color: green;
        width: 20px;
    }
</style>

<body>
    <h2> Results : </h2>
    <main>
        <br><br><br>
        {% block learners%}
        <hr style="background-color:green; width:20px;">
        <table border="1" cellpadding="10">

            <tr>
                <th>ID</th>
                <th>name</th>
                <th>surname</th>
                <th>email</th>
                <th>contact</th>
                <th>address</th>
                <th>student number</th>


            </tr>
            <tr>
                <td>{{learners[0]}}</td>
                <td>{{learners[1]}}</td>
                <td>{{learners[2]}}</td>
                <td>{{learners[3]}}</td>
                <td>{{learners[4]}}</td>
                <td>{{learners[5]}}</td>
                <td>{{learners[6]}}</td>



            </tr>

        </table>
        {% endblock %}
<br><br><br><br>
        <button type="submit" >Save updates </button>
    </main>

</body>
