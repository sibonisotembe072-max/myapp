<style>

    body{

    }
header{

<body>
   
    <header>
       <h1>Durban North College</h1>

</main>
 <p id="view"></p>

<script>
    

function adding_payment(){
       
               
    
        document.getElementById("view").innerHTML=`<div style=

           </div>`
            
        
    }
    function choosestudent(){

        "width: 90%;
         height:fit-content;
          border:5px solid green;

     function change(){
